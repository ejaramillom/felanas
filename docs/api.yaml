openapi: 3.0.0
info:
  title: Felanas API
  version: 1.0.0
  description: Multi-tenant API for employee management
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /employees:
    get:
      summary: List employees for current company
      responses:
        '200':
          description: A list of employees
    post:
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                status:
                  type: string
      responses:
        '201':
          description: Created
  /employees/{id}:
    get:
      summary: Get specific employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Employee details
        '404':
          description: Not found (or belongs to another company)
