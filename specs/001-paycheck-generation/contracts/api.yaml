openapi: 3.0.0
info:
  title: Paycheck & Schedule API
  version: 1.0.0
paths:
  /paychecks/generate:
    post:
      summary: Trigger bulk paycheck generation for a period
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [startDate, endDate]
              properties:
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
      responses:
        '202':
          description: Generation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: {type: string}

  /paychecks:
    get:
      summary: List paychecks
      parameters:
        - name: periodStart
          in: query
          schema: {type: string, format: date}
        - name: employeeId
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: List of paychecks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Paycheck'

  /paychecks/{id}/pdf:
    get:
      summary: Download Paycheck PDF
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: PDF Stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /schedules/generate:
    post:
      summary: Generate schedule for a period
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [startDate, endDate]
              properties:
                startDate: {type: string, format: date}
                endDate: {type: string, format: date}
      responses:
        '200':
          description: Generated schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'

components:
  schemas:
    Paycheck:
      type: object
      properties:
        id: {type: string, format: uuid}
        employeeName: {type: string}
        netAmount: {type: number}
        status: {type: string}
    
    Schedule:
      type: object
      properties:
        date: {type: string, format: date}
        employeeId: {type: string, format: uuid}
        shift: {type: string, enum: [MORNING, AFTERNOON]}
